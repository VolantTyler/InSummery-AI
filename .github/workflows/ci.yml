name: CI

# PR validation that does not depend on Firebase deploy secrets.
# Complements "Deploy to Firebase Hosting on PR" (preview) and
# "CI/CD Deployment" (main-only deploy).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Compile Python sources
        run: |
          # Avoid compiling functions/venv if present locally/on runners.
          uv run python -m compileall app functions/main.py

      - name: Run Pytest Unit Tests
        run: |
          uv run pytest

      # The identity suite makes no model calls, so it needs no API key and
      # costs nothing per PR. It gates PIIMasker and child-name resolution --
      # the layer every LLM metric is computed on top of. A masking defect
      # does not look like a masking bug in the aggregate scores, it looks
      # like a mediocre model, so this runs on every change.
      - name: Run Offline Eval Suites (no API key required)
        run: |
          uv run insummery-eval run --suites identity --no-baseline-check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Page-Load Perf Budgets
        run: |
          cd frontend
          npm run test:perf
