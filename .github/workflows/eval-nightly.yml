name: Nightly Agent Eval

# The live evaluation loop. Split out from ci.yml on purpose:
#
#   ci.yml         -> the offline `identity` suite, every PR, no credential, free.
#   this workflow  -> every suite including the live LLM ones, once a night.
#
# Running the full suite per-PR would put a paid API call (and its flake risk)
# in front of every change. Running it nightly keeps the window in which a
# quality regression can sit undetected under 24 hours, which is the gap this
# closes: before this workflow existed, `insummery-eval` was never executed by
# CI at all and the thresholds and committed baseline were decorative.

on:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      suites:
        description: 'Space-separated suites to run (default: all)'
        required: false
        default: ''
      judge:
        description: 'Also run the non-gating LLM-judge tier'
        type: boolean
        required: false
        default: false

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-eval:
    name: Live Eval + Baseline Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      # Vertex AI is the project's chosen provider (app/model_client.py
      # defaults to vertex_ai/). Authenticate to Google Cloud when a service
      # account credential is configured; the API-key path below is the
      # fallback so this workflow keeps running while Vertex CI auth is being
      # set up.
      #
      # The `secrets` context cannot be referenced directly inside an `if:`
      # condition -- GitHub Actions does not expose it there (only in `env:`
      # / `with:`), and a workflow that tries fails validation entirely, not
      # just that step. So a preceding step exports presence as a step
      # output, which `if:` on steps.*.outputs *is* allowed to read.
      - name: Check for a Vertex AI credential
        id: check_gcp
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (Vertex AI)
        id: gcp_auth
        if: steps.check_gcp.outputs.has_key == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Select model provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          VERTEX_AUTHED: ${{ steps.gcp_auth.outcome == 'success' }}
        run: |
          if [ "$VERTEX_AUTHED" = "true" ] && [ -n "$GCP_PROJECT" ]; then
            echo "Using Vertex AI (project $GCP_PROJECT)"
            echo "GEMINI_MODEL=vertex_ai/gemini-2.5-flash" >> "$GITHUB_ENV"
            echo "VERTEXAI_PROJECT=$GCP_PROJECT" >> "$GITHUB_ENV"
            echo "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT" >> "$GITHUB_ENV"
            echo "VERTEXAI_LOCATION=${{ secrets.GCP_LOCATION || 'us-central1' }}" >> "$GITHUB_ENV"
          elif [ -n "$GEMINI_API_KEY" ]; then
            echo "Vertex AI is not configured; falling back to the Gemini API key."
            echo "::warning::Running against gemini/ (API key), not Vertex AI."
            echo "To use Vertex, add the GCP_SA_KEY and GCP_PROJECT secrets."
            echo "GEMINI_MODEL=gemini/gemini-2.5-flash" >> "$GITHUB_ENV"
          else
            # Fail loudly rather than silently green: a nightly eval that
            # quietly skips because a secret expired is worse than no nightly
            # eval, because it looks like passing.
            echo "::error::No model credential is configured for this repository."
            echo "Add GCP_SA_KEY + GCP_PROJECT (Vertex AI), or GEMINI_API_KEY,"
            echo "under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Run Full Eval Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          # GEMINI_MODEL / VERTEXAI_* come from the "Select model provider"
          # step via GITHUB_ENV. Baselines are per-model, so switching provider
          # switches which baseline file the regression gate compares against.
          FORCE_CLOUD_LLM: 'true'
        run: |
          SUITES_ARG=""
          if [ -n "${{ github.event.inputs.suites }}" ]; then
            SUITES_ARG="--suites ${{ github.event.inputs.suites }}"
          fi
          JUDGE_ARG=""
          if [ "${{ github.event.inputs.judge }}" = "true" ]; then
            JUDGE_ARG="--judge"
          fi
          uv run insummery-eval run \
            $SUITES_ARG $JUDGE_ARG \
            --json-out output/eval_report.json

      # Runs even when the gate above failed: the diagnosis is most valuable
      # precisely on the nights something broke.
      - name: Write Diagnosis Report
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_CLOUD_LLM: 'true'
        run: |
          uv run insummery-eval diagnose \
            --out output/diagnosis.md \
            --json-out output/diagnosis.json || true

      - name: Publish Diagnosis to Job Summary
        if: always()
        run: |
          if [ -f output/diagnosis.md ]; then
            cat output/diagnosis.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Eval Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            output/eval_report.json
            output/diagnosis.md
            output/diagnosis.json
          retention-days: 30
          if-no-files-found: warn
