name: Nightly Agent Eval

# The live evaluation loop. Split out from ci.yml on purpose:
#
#   ci.yml         -> the offline `identity` suite, every PR, no credential, free.
#   this workflow  -> every suite including the live LLM ones, once a night.
#
# Running the full suite per-PR would put a paid API call (and its flake risk)
# in front of every change. Running it nightly keeps the window in which a
# quality regression can sit undetected under 24 hours, which is the gap this
# closes: before this workflow existed, `insummery-eval` was never executed by
# CI at all and the thresholds and committed baseline were decorative.

on:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      suites:
        description: 'Space-separated suites to run (default: all)'
        required: false
        default: ''
      judge:
        description: 'Also run the non-gating LLM-judge tier'
        type: boolean
        required: false
        default: false

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-eval:
    name: Live Eval + Baseline Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      # Vertex AI is the project's provider (app/model_client.py defaults to
      # vertex_ai/). Prefer Workload Identity Federation. The JSON key remains
      # a fallback until a run logs "Google auth path: workload identity
      # federation". GEMINI_API_KEY is the last resort and cannot be federated.
      # Auth runs after dependency install so the short-lived GitHub OIDC token
      # is exchanged immediately before the eval, not before a long install.
      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: ./.github/actions/google-cloud-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT || secrets.GCP_PROJECT || 'in-summery' }}
          required: 'false'

      - name: Select model provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT: ${{ steps.gcp_auth.outputs.project_id || vars.GCP_PROJECT || secrets.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION || secrets.GCP_LOCATION || 'us-central1' }}
          AUTH_METHOD: ${{ steps.gcp_auth.outputs.method }}
        run: |
          if [ "$AUTH_METHOD" = "wif" ] || [ "$AUTH_METHOD" = "key" ]; then
            if [ -z "$GCP_PROJECT" ]; then
              echo "::error::Google auth succeeded but no GCP project id is available."
              exit 1
            fi
            echo "Using Vertex AI (project $GCP_PROJECT, auth $AUTH_METHOD)"
            echo "GEMINI_MODEL=vertex_ai/gemini-2.5-flash" >> "$GITHUB_ENV"
            echo "VERTEXAI_PROJECT=$GCP_PROJECT" >> "$GITHUB_ENV"
            echo "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT" >> "$GITHUB_ENV"
            echo "VERTEXAI_LOCATION=$GCP_LOCATION" >> "$GITHUB_ENV"
          elif [ -n "$GEMINI_API_KEY" ]; then
            echo "Vertex AI is not configured; falling back to the Gemini API key."
            echo "::warning::Running against gemini/ (API key), not Vertex AI."
            echo "To use Vertex, set GCP_WIF_PROVIDER and GCP_EVAL_SERVICE_ACCOUNT (or GCP_SERVICE_ACCOUNT)."
            echo "The GCP_SA_KEY secret is only a fallback. See docs/wif-setup.md."
            echo "GEMINI_MODEL=gemini/gemini-2.5-flash" >> "$GITHUB_ENV"
          else
            # Fail loudly rather than silently green: a nightly eval that
            # quietly skips because a secret expired is worse than no nightly
            # eval, because it looks like passing.
            echo "::error::No model credential is configured for this repository."
            echo "Set GCP_WIF_PROVIDER and an eval service account (Vertex AI),"
            echo "or keep GCP_SA_KEY until WIF succeeds, or set GEMINI_API_KEY."
            echo "See docs/wif-setup.md."
            exit 1
          fi

      - name: Run Full Eval Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GEMINI_MODEL / VERTEXAI_* come from the "Select model provider"
          # step via GITHUB_ENV. GOOGLE_APPLICATION_CREDENTIALS is exported by
          # google-github-actions/auth when Vertex auth succeeded. Baselines
          # are per-model, so switching provider switches which baseline file
          # the regression gate compares against.
          FORCE_CLOUD_LLM: 'true'
          # The eval-only service account is scoped to roles/aiplatform.user
          # only (least privilege), so it lacks cloudtrace.traces.patch.
          # Without this, setup_telemetry() tries to export spans to Cloud
          # Trace anyway and the exporter retries + logs a full traceback on
          # its 5s export interval for the entire run.
          INSUMMERY_DISABLE_CLOUD_TRACE: 'true'
          #
          # WANDB_API_KEY is deliberately NOT set here (confirmed root cause
          # of this job hitting its 45-minute timeout, reproduced twice).
          # setup_telemetry() calls setup_weave() unconditionally on every
          # CLI invocation, and with a real WANDB_API_KEY present it activates
          # live Weave tracing with redact_pii=True. Weave's PII redaction
          # lazily constructs a Presidio AnalyzerEngine on the first traced
          # call, which -- if the spaCy model isn't already installed --
          # tries to self-install it via `pip`. `uv venv` does not include
          # pip in the venv, so that install fails inside a background
          # worker thread. Confirmed in the job logs: three caught
          # "Exception in worker" / SystemExit(1) tracebacks at job start,
          # immediately followed by total silence for the rest of the run
          # until GitHub's own timeout killed it. This command never passes
          # --weave-publish, so Weave publishing was never actually used --
          # the key was only ever activating this broken path for nothing.
          # "Write Diagnosis Report" below has never set this key and has
          # never hung, on either attempt, which is the direct A/B evidence.
        run: |
          SUITES_ARG=""
          if [ -n "${{ github.event.inputs.suites }}" ]; then
            SUITES_ARG="--suites ${{ github.event.inputs.suites }}"
          fi
          JUDGE_ARG=""
          if [ "${{ github.event.inputs.judge }}" = "true" ]; then
            JUDGE_ARG="--judge"
          fi
          uv run insummery-eval run \
            $SUITES_ARG $JUDGE_ARG \
            --json-out output/eval_report.json

      # Runs even when the gate above failed: the diagnosis is most valuable
      # precisely on the nights something broke.
      - name: Write Diagnosis Report
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_CLOUD_LLM: 'true'
          INSUMMERY_DISABLE_CLOUD_TRACE: 'true'
        run: |
          uv run insummery-eval diagnose \
            --out output/diagnosis.md \
            --json-out output/diagnosis.json || true

      - name: Publish Diagnosis to Job Summary
        if: always()
        run: |
          if [ -f output/diagnosis.md ]; then
            cat output/diagnosis.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Eval Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            output/eval_report.json
            output/diagnosis.md
            output/diagnosis.json
          retention-days: 30
          if-no-files-found: warn
