name: CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv (Python Package Manager)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run Python Linters (Syntax & Import Checks)
        run: |
          # Scope to app + entrypoint so functions/venv is never compiled.
          uv run python -m compileall app functions/main.py

      - name: Run Pytest Unit Tests
        run: |
          uv run pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint & Build Test
        run: |
          cd frontend
          npm run build

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Frontend Page-Load Perf Budgets
        run: |
          cd frontend
          # test:perf rebuilds with mock Firebase; separate from prod build above.
          npm run test:perf

  deploy:
    name: Deploy to Firebase
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # 15.22.3 or newer: firebase-tools reads the external_account credentials
      # file written by google-github-actions/auth (ADC / WIF). Earlier 15.22
      # builds failed that path with "have you run firebase login?".
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.33.0

      - name: Set up Functions Virtual Environment
        run: |
          python -m venv functions/venv
          functions/venv/bin/pip install --upgrade pip
          functions/venv/bin/pip install -r functions/requirements.txt

      - name: Build Frontend React App
        run: |
          cd frontend
          npm ci
          npm run build

      # Authenticate immediately before deploy. The auth action writes the
      # credentials file and exports GOOGLE_APPLICATION_CREDENTIALS; this
      # workflow does not echo a JSON key to disk. The JSON key is passed
      # only on main, so a workflow_dispatch from another ref cannot use it.
      # WIF for the deploy service account should additionally be bound to
      # refs/heads/main (see docs/wif-setup.md).
      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: ./.github/actions/google-cloud-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_DEPLOY || vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_KEY || '' }}
          project_id: ${{ vars.GCP_PROJECT || 'in-summery' }}
          required: 'true'
          install_gcloud: 'true'

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT: ${{ vars.GCP_PROJECT || 'in-summery' }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp_auth.outputs.credentials_file_path }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.gcp_auth.outputs.credentials_file_path }}
        run: |
          firebase deploy --only hosting,functions,firestore --project "$FIREBASE_PROJECT" --non-interactive
