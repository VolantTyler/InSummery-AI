# Preview deploy for pull requests opened from this repository.
#
# FirebaseExtended/action-hosting-deploy does not support Workload Identity
# Federation or ambient ADC. As of v0.11.0 (June 2026) firebaseServiceAccount
# is still required: the action writes that string to a temp file and never
# reads GOOGLE_APPLICATION_CREDENTIALS (src/index.ts createGacFile; issue #399,
# PR #398 unreleased). This workflow authenticates with
# google-github-actions/auth and runs `firebase hosting:channel:deploy`, which
# uses the credentials file the auth action exports. The preview URL is posted
# with the job's GITHUB_TOKEN.
#
# Fork pull requests are skipped. A pull_request from a fork does not receive
# secrets or an OIDC identity token, and this file does not use
# pull_request_target.

name: Deploy to Firebase Hosting on PR
on: pull_request
concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.33.0

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: ./.github/actions/google-cloud-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IN_SUMMERY }}
          project_id: ${{ vars.GCP_PROJECT || 'in-summery' }}
          required: 'true'
          install_gcloud: 'true'

      - name: Deploy Hosting preview channel
        id: channel
        env:
          FIREBASE_PROJECT: ${{ vars.GCP_PROJECT || 'in-summery' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp_auth.outputs.credentials_file_path }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.gcp_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy "pr${PR_NUMBER}" \
            --project "$FIREBASE_PROJECT" \
            --expires 7d \
            --non-interactive \
            --json | tee "$RUNNER_TEMP/hosting-channel.json"
          python3 .github/scripts/hosting_preview.py render \
            "$RUNNER_TEMP/hosting-channel.json" \
            --project "$FIREBASE_PROJECT" \
            --sha "$HEAD_SHA" \
            --comment-out "$RUNNER_TEMP/preview-comment.md" \
            --url-out "$RUNNER_TEMP/preview-url.txt"

      - name: Comment with the preview URL
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          url=$(cat "$RUNNER_TEMP/preview-url.txt")
          jq -n --rawfile body "$RUNNER_TEMP/preview-comment.md" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          ids_text=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- insummery-firebase-hosting-preview -->")) | .id')
          comment_id=${ids_text%%$'\n'*}
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" --input "$RUNNER_TEMP/comment.json"
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --input "$RUNNER_TEMP/comment.json"
          fi
          jq -n --arg sha "$HEAD_SHA" --arg url "$url" \
            '{name:"Firebase Hosting Preview", head_sha:$sha, status:"completed", conclusion:"success", details_url:$url, output:{title:"Deploy preview succeeded", summary:$url}}' \
            > "$RUNNER_TEMP/check.json"
          gh api --method POST "repos/${REPO}/check-runs" --input "$RUNNER_TEMP/check.json"

      - name: Comment when the preview deploy fails
        if: failure() && steps.channel.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/hosting_preview.py failure-comment \
            --run-url "$RUN_URL" \
            --out "$RUNNER_TEMP/preview-comment.md"
          jq -n --rawfile body "$RUNNER_TEMP/preview-comment.md" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          ids_text=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- insummery-firebase-hosting-preview -->")) | .id')
          comment_id=${ids_text%%$'\n'*}
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" --input "$RUNNER_TEMP/comment.json"
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --input "$RUNNER_TEMP/comment.json"
          fi
